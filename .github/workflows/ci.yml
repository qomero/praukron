name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # ubuntu-latest no longer ships Python 3.9; test it on the last Ubuntu that does.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Praukron has no dependencies and no build step. If this ever needs a
      # package installed, something has gone wrong with ADR-016.
      - name: Unit suite
        run: python -m unittest discover -s tests

      - name: Installer suite
        run: sh tests/install.sh

  runtime-boundary:
    name: no network, no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ADR-016: the runtime is standard library only. An import that reaches
      # outside it should fail here rather than in someone's repository.
      - name: Runtime imports only the standard library
        run: |
          python - <<'PY'
          import pathlib, sys, ast
          stdlib = set(sys.stdlib_module_names)
          offenders = []
          for path in sorted(pathlib.Path("src/praukron").glob("*.py")):
              tree = ast.parse(path.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [] if node.level else [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name != "praukron":
                          offenders.append(f"{path.name}: {name}")
          if offenders:
              print("::error::runtime imports outside the standard library")
              print("\n".join(offenders))
              raise SystemExit(1)
          print("clean")
          PY
