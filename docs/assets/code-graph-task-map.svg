<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">A task and the code it touched</title>
  <desc id="desc">An invented task, T-001, is linked by Git capture to total() and Invoice.save, and by a person's reference to orders.py. The lighter neighbours, sum_line(), round_total(), and Storage.write, are one step out. Solid engine edges connect total() to its neighbours. A solid edge from Invoice.save ends at an open diamond labelled unknown because the engine could not tell the target. A dashed edge to Storage.write was recorded by an agent and is unverified. The legend distinguishes the embedded engine, Git capture, an agent, and a person by line style as well as labels.</desc>
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --ink:#1d2933; --muted:#52616c; --line:#71818b; --rule:#b9c6ce; --panel:#f1f6f4; --neighbour:#fafbfc; --accent:#286752; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#101d27; --ink:#f3f6f7; --muted:#bdcbd3; --line:#9aafb9; --rule:#617987; --panel:#203a36; --neighbour:#14232e; --accent:#8be0bd; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif; fill:var(--ink); font-size:14px; }
    .heading { font-size:24px; font-weight:650; }
    .note { fill:var(--muted); font-size:13px; }
    .label { font-size:13px; font-weight:600; }
    .symbol { font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; font-size:15px; }
    .node { fill:var(--panel); stroke:var(--accent); stroke-width:1.2; }
    .neighbour { fill:var(--neighbour); stroke:var(--rule); stroke-width:1; }
    .engine { fill:none; stroke:var(--line); stroke-width:1.3; stroke-linejoin:round; }
    .capture { fill:none; stroke:var(--accent); stroke-width:1; }
    .agent { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:7 4; }
    .person { fill:none; stroke:var(--line); stroke-width:1.6; stroke-dasharray:1 5; stroke-linecap:round; }
  </style>
  <rect width="800" height="500" fill="var(--bg)"/>
  <text class="heading" x="24" y="35">A task and the code it touched</text>
  <text class="note" x="24" y="59">The map says what is known, what is recorded, and what is unknown.</text>
  <text class="label" x="24" y="94">Task</text>
  <text class="label" x="240" y="94">Files and symbols</text>
  <text class="label" x="588" y="94">Neighbours · one step out</text>

  <!-- Four sources have four different line styles. -->
  <path class="person" d="M94 228V134H240"/>
  <path class="capture" d="M164 247H198V216H240 M164 251H202V220H240 M164 277H202V332H240 M164 281H198V336H240"/>
  <path class="engine" d="M420 218H474V134H588 M420 218H588"/>
  <path class="engine" d="m582 130 6 4-6 4 m0 76 6 4-6 4"/>
  <path class="agent" d="M420 334H468V322H588"/>
  <path class="engine" d="M420 350H494V388H564 M564 388l6-5 6 5-6 5z"/>
  <text class="note" x="448" y="299">agent · unverified</text>
  <text class="note" x="588" y="393">unknown</text>

  <rect class="node" x="24" y="228" width="140" height="70" rx="4"/>
  <text class="symbol" x="94" y="268" text-anchor="middle">T-001</text>
  <rect class="node" x="240" y="112" width="180" height="44" rx="4"/>
  <text class="symbol" x="330" y="140" text-anchor="middle">orders.py</text>
  <rect class="node" x="240" y="190" width="180" height="56" rx="4"/>
  <text class="symbol" x="330" y="224" text-anchor="middle">total()</text>
  <rect class="node" x="240" y="306" width="180" height="56" rx="4"/>
  <text class="symbol" x="330" y="340" text-anchor="middle">Invoice.save</text>

  <rect class="neighbour" x="588" y="112" width="188" height="44" rx="4"/>
  <text class="symbol" x="682" y="140" text-anchor="middle">sum_line()</text>
  <rect class="neighbour" x="588" y="196" width="188" height="44" rx="4"/>
  <text class="symbol" x="682" y="224" text-anchor="middle">round_total()</text>
  <rect class="neighbour" x="588" y="300" width="188" height="44" rx="4"/>
  <text class="symbol" x="682" y="328" text-anchor="middle">Storage.write</text>

  <path d="M24 420H776" stroke="var(--rule)" stroke-width="1"/>
  <path class="engine" d="M24 446H64"/>
  <text class="note" x="76" y="451">Embedded engine</text>
  <path class="capture" d="M420 444H460 M420 448H460"/>
  <text class="note" x="472" y="451">Git capture · when a task closes</text>
  <path class="agent" d="M24 477H64"/>
  <text class="note" x="76" y="482">Agent · unverified</text>
  <path class="person" d="M420 477H460"/>
  <text class="note" x="472" y="482">Person</text>
</svg>
